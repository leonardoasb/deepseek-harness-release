<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DeepSeek Harness</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #111; }
      main { text-align: center; padding: 2rem; }
      .brand { display: block; width: min(430px, 76vw); height: auto; margin: 0 auto 34px; }
      .mark { width: 38px; height: 38px; margin: 0 auto 20px; border: 2px solid #111; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
      p { margin: 0; max-width: 520px; color: #666; line-height: 1.5; }
      @media (prefers-color-scheme: dark) {
        body { background: #1e1f22; color: #f2f2f4; }
        p { color: #a5a5ad; }
        .mark { border-color: #f2f2f4; border-top-color: transparent; }
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .mark { animation: none; border-color: #7397ff; } }
    </style>
  </head>
  <body>
    <main>
      <img class="brand" src="brand.png" alt="DeepSeek Harness">
      <div class="mark" aria-hidden="true"></div>
      <p id="message"></p>
    </main>
    <script>
      const params = new URLSearchParams(location.search)
      document.querySelector('#message').textContent = params.get('message') || 'Starting…'
    </script>
  </body>
</html>
